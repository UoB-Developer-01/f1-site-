<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 10 Formula 1 Racers of All Time</title>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@200;300;400;600;700;900&family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #E10600;
    --red-dark: #a00400;
    --red-glow: rgba(225,6,0,0.35);
    --white: #ffffff;
    --off-white: #f0f0f0;
    --card-bg: #111111;
    --card-border: #222222;
    --dark: #0a0a0a;
    --mid: #1a1a1a;
    --text-muted: #888;
    --carbon1: #1a1a1a;
    --carbon2: #141414;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--dark);
    color: var(--white);
    font-family: 'Titillium Web', sans-serif;
    overflow-x: hidden;
  }

  html[lang="ar"] body { font-family: 'Cairo', sans-serif; }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 8px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 8px);
    pointer-events: none;
    z-index: 0;
  }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: rgba(0,0,0,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 2px solid var(--red);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2rem;
    height: 56px;
  }

  .nav-logo { display: flex; align-items: center; gap: 0.75rem; }

  .nav-f1-badge {
    background: var(--red);
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 1.1rem;
    letter-spacing: 0.05em;
    padding: 3px 18px 2px 10px;
    clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%);
  }

  .nav-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--off-white);
  }

  html[lang="ar"] .nav-title { font-family: 'Cairo', sans-serif; letter-spacing: 0; }

  .nav-right { display: flex; align-items: center; gap: 1rem; }

  .nav-stripe {
    height: 3px;
    width: 80px;
    background: repeating-linear-gradient(90deg, var(--red) 0 8px, transparent 8px 14px);
  }

  .lang-btn {
    background: transparent;
    border: 1px solid rgba(225,6,0,0.5);
    color: var(--red);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    padding: 5px 20px 5px 14px;
    clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%);
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    text-transform: uppercase;
  }

  html[lang="ar"] .lang-btn {
    font-family: 'Cairo', sans-serif;
    letter-spacing: 0;
    clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%);
    padding: 5px 14px 5px 20px;
  }

  .lang-btn:hover { background: var(--red); color: #fff; }

  /* ── HERO ── */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding-top: 56px;
  }

  .hero-lines { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

  .speed-line {
    position: absolute;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
    opacity: 0;
    animation: speedLine 3s infinite ease-in-out;
  }

  @keyframes speedLine {
    0%   { transform: translateX(-100%); opacity: 0; }
    10%  { opacity: 0.6; }
    80%  { opacity: 0.3; }
    100% { transform: translateX(100vw); opacity: 0; }
  }

  .checkered-band {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 40px;
    background-image: repeating-conic-gradient(#fff 0% 25%, transparent 0% 50%);
    background-size: 20px 20px;
    opacity: 0.07;
  }

  .checkered-band-top { bottom: auto; top: 56px; opacity: 0.05; }

  .hero-slash {
    position: absolute;
    top: 0; right: -10%;
    width: 55%; height: 100%;
    background: linear-gradient(135deg, transparent 30%, rgba(225,6,0,0.06) 30%);
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem;
  }

  .hero-eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.4em;
    color: var(--red);
    text-transform: uppercase;
    margin-bottom: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
  }

  html[lang="ar"] .hero-eyebrow { font-family: 'Cairo', sans-serif; letter-spacing: 0.05em; }

  .hero-eyebrow::before, .hero-eyebrow::after {
    content: ''; height: 1px; width: 60px; background: var(--red);
  }

  .hero-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: clamp(3.5rem, 10vw, 9rem);
    line-height: 0.9;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    color: var(--white);
    text-shadow: 0 0 80px rgba(225,6,0,0.3);
  }

  html[lang="ar"] .hero-title { font-family: 'Cairo', sans-serif; letter-spacing: 0; }

  .hero-title .ht1 { color: var(--white); display: block; }
  .hero-title .ht2 { color: var(--red); display: block; }

  .hero-subtitle {
    margin-top: 1.5rem;
    font-family: 'Titillium Web', sans-serif;
    font-weight: 300;
    font-size: 1rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  html[lang="ar"] .hero-subtitle { font-family: 'Cairo', sans-serif; letter-spacing: 0.03em; }

  .hero-scroll-cue {
    margin-top: 3rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
    color: var(--text-muted);
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    animation: bob 2s infinite ease-in-out;
  }

  html[lang="ar"] .hero-scroll-cue { font-family: 'Cairo', sans-serif; letter-spacing: 0; }
  .hero-scroll-cue svg { opacity: 0.5; }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(6px); }
  }

  .hero-bg-number {
    position: absolute;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 40vw;
    color: rgba(225,6,0,0.04);
    line-height: 1;
    user-select: none;
    pointer-events: none;
    z-index: 1;
    top: 50%; left: 50%;
    transform: translate(-50%, -48%);
  }

  /* ── SECTION HEADER ── */
  .section-header {
    text-align: center;
    padding: 5rem 2rem 3rem;
    position: relative;
  }

  .section-header h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: clamp(2rem, 5vw, 3.5rem);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  html[lang="ar"] .section-header h2 { font-family: 'Cairo', sans-serif; letter-spacing: 0; }

  .section-header h2 em { color: var(--red); font-style: normal; }

  .section-divider {
    margin: 1rem auto 0;
    width: 80px; height: 3px;
    background: var(--red);
    position: relative;
  }

  .section-divider::before {
    content: '';
    position: absolute;
    left: 90px; top: 0;
    width: 20px; height: 3px;
    background: var(--red);
    opacity: 0.4;
  }

  /* ── DRIVER GRID ── */
  .drivers-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 1.5rem 6rem;
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
    position: relative;
    z-index: 1;
  }

  /* ── DRIVER CARD ── */
  .driver-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-left: 3px solid var(--red);
    position: relative;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    display: grid;
    grid-template-columns: 100px 280px 1fr;
    grid-template-rows: auto auto;
    min-height: 220px;
  }

  html[lang="ar"] .driver-card {
    border-left: 1px solid var(--card-border);
    border-right: 3px solid var(--red);
  }

  .driver-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, rgba(225,6,0,0.04) 0%, transparent 50%);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .driver-card:hover {
    transform: translateY(-4px) translateX(4px);
    box-shadow: -8px 8px 40px rgba(225,6,0,0.2), 0 20px 60px rgba(0,0,0,0.5);
    border-color: rgba(225,6,0,0.4);
    border-left-color: var(--red);
  }

  html[lang="ar"] .driver-card:hover {
    transform: translateY(-4px) translateX(-4px);
    box-shadow: 8px 8px 40px rgba(225,6,0,0.2), 0 20px 60px rgba(0,0,0,0.5);
    border-right-color: var(--red);
  }

  .driver-card:hover::before { opacity: 1; }

  .card-rank {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    border-right: 1px solid var(--card-border);
    background: rgba(225,6,0,0.03);
    grid-row: 1 / 3;
  }

  html[lang="ar"] .card-rank { border-right: none; border-left: 1px solid var(--card-border); }

  .rank-number {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 3.5rem;
    color: var(--red);
    line-height: 1;
  }

  .rank-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-top: 0.2rem;
  }

  html[lang="ar"] .rank-label { font-family: 'Cairo', sans-serif; letter-spacing: 0; font-size: 0.72rem; }

  .card-photo {
    position: relative;
    grid-row: 1 / 3;
    overflow: hidden;
    background: #0d0d0d;
  }

  .card-photo img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: top center;
    filter: grayscale(20%) contrast(1.05);
    transition: transform 0.5s ease, filter 0.5s ease;
  }

  .driver-card:hover .card-photo img {
    transform: scale(1.05);
    filter: grayscale(0%) contrast(1.1);
  }

  .card-photo::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 4px;
    background: var(--red);
  }

  .card-info {
    padding: 1.5rem 2rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-right: 1px solid var(--card-border);
  }

  html[lang="ar"] .card-info { border-right: none; border-left: 1px solid var(--card-border); }

  .driver-meta { display: flex; flex-direction: column; gap: 0.2rem; }

  .driver-nationality {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    color: var(--red);
    text-transform: uppercase;
    font-weight: 600;
  }

  html[lang="ar"] .driver-nationality { font-family: 'Cairo', sans-serif; letter-spacing: 0.05em; }

  .driver-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: clamp(1.6rem, 3vw, 2.4rem);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    line-height: 1;
    color: var(--white);
  }

  html[lang="ar"] .driver-name { font-family: 'Cairo', sans-serif; letter-spacing: 0; text-transform: none; }

  .driver-years {
    font-size: 0.8rem;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    margin-top: 0.3rem;
  }

  .driver-teams { font-size: 0.75rem; color: #666; margin-top: 0.15rem; }

  .championships-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1rem;
    background: rgba(225,6,0,0.12);
    border: 1px solid rgba(225,6,0,0.3);
    padding: 0.35rem 0.75rem;
    clip-path: polygon(0 0, 100% 0, 95% 100%, 0 100%);
  }

  html[lang="ar"] .championships-badge { clip-path: polygon(0 0, 100% 0, 100% 100%, 5% 100%); }

  .champ-icon { width: 16px; height: 16px; color: var(--red); }

  .champ-count {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    color: var(--red);
  }

  .champ-label { font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.1em; }

  html[lang="ar"] .champ-label { font-family: 'Cairo', sans-serif; letter-spacing: 0; font-size: 0.75rem; }

  .card-stats { padding: 1.5rem 2rem; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.75rem;
    margin-bottom: 1.2rem;
  }

  .stat-item { display: flex; flex-direction: column; gap: 0.1rem; }

  .stat-value {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.6rem;
    color: var(--white);
    line-height: 1;
  }

  .stat-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  html[lang="ar"] .stat-label { font-family: 'Cairo', sans-serif; letter-spacing: 0; font-size: 0.7rem; }

  .stat-bar {
    height: 2px;
    background: var(--card-border);
    margin-top: 0.3rem;
    position: relative;
    overflow: hidden;
  }

  .stat-bar-fill {
    position: absolute;
    top: 0; left: 0; height: 100%;
    background: var(--red);
    transition: width 1s ease;
  }

  html[lang="ar"] .stat-bar-fill { left: auto; right: 0; }

  .driver-bio {
    font-size: 0.82rem;
    line-height: 1.65;
    color: #aaa;
    border-top: 1px solid var(--card-border);
    padding-top: 1rem;
  }

  html[lang="ar"] .driver-bio {
    font-family: 'Cairo', sans-serif;
    font-size: 0.85rem;
    line-height: 1.9;
  }

  .corner-deco {
    position: absolute;
    top: 0; right: 0;
    width: 0; height: 0;
    border-style: solid;
    border-width: 0 40px 40px 0;
    border-color: transparent rgba(225,6,0,0.5) transparent transparent;
    transition: border-color 0.3s;
  }

  html[lang="ar"] .corner-deco {
    right: auto; left: 0;
    border-width: 40px 40px 0 0;
    border-color: rgba(225,6,0,0.5) transparent transparent transparent;
  }

  .driver-card:hover .corner-deco { border-color: transparent var(--red) transparent transparent; }
  html[lang="ar"] .driver-card:hover .corner-deco { border-color: var(--red) transparent transparent transparent; }

  /* ── RESPONSIVE ── */
  @media (max-width: 1000px) {
    .driver-card { grid-template-columns: 80px 220px 1fr; }
  }

  @media (max-width: 768px) {
    .driver-card {
      grid-template-columns: 60px 1fr;
      grid-template-rows: 200px auto auto;
    }
    .card-rank {
      grid-column: 1; grid-row: 2 / 4;
      border-right: 1px solid var(--card-border);
      padding: 1rem 0.5rem;
    }
    html[lang="ar"] .card-rank { border-right: none; border-left: 1px solid var(--card-border); }
    .rank-number { font-size: 2.2rem; }
    .card-photo { grid-column: 1 / 3; grid-row: 1; height: 200px; }
    .card-info {
      grid-column: 2; grid-row: 2;
      padding: 1rem 1rem 0.5rem;
      border-right: none;
      border-bottom: 1px solid var(--card-border);
    }
    html[lang="ar"] .card-info { border-left: none; }
    .card-stats { grid-column: 2; grid-row: 3; padding: 1rem; }
    .stats-grid { grid-template-columns: repeat(4, 1fr); }
  }

  @media (max-width: 520px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .driver-card { grid-template-columns: 50px 1fr; }
  }

  /* ── FOOTER ── */
  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 3rem 2rem;
    border-top: 1px solid var(--card-border);
    color: var(--text-muted);
    font-size: 0.78rem;
    letter-spacing: 0.1em;
  }

  html[lang="ar"] footer { font-family: 'Cairo', sans-serif; letter-spacing: 0; font-size: 0.85rem; }

  footer strong { color: var(--red); }

  /* ── SCROLL REVEAL ── */
  .reveal {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }

  .reveal.visible { opacity: 1; transform: translateY(0); }

  .driver-card:nth-child(even) { border-left-color: var(--red); }
  html[lang="ar"] .driver-card:nth-child(even) { border-right-color: var(--red); }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">
    <span class="nav-f1-badge">F1</span>
    <span class="nav-title" data-i18n="navTitle">Greatest Drivers</span>
  </div>
  <div class="nav-right">
    <div class="nav-stripe"></div>
    <button class="lang-btn" id="langBtn" onclick="toggleLang()">عربي</button>
  </div>
</nav>

<section class="hero">
  <div class="checkered-band checkered-band-top"></div>
  <div class="hero-lines" id="heroLines"></div>
  <div class="hero-slash"></div>
  <div class="hero-bg-number">10</div>
  <div class="hero-content">
    <div class="hero-eyebrow" data-i18n="eyebrow">Formula 1</div>
    <h1 class="hero-title">
      <span class="ht1" data-i18n="ht1">Top 10</span>
      <span class="ht2" data-i18n="ht2">Racers</span>
    </h1>
    <p class="hero-subtitle" data-i18n="subtitle">The Greatest Drivers in the History of the Sport</p>
    <div class="hero-scroll-cue">
      <span data-i18n="scroll">Scroll</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M5 12l7 7 7-7"/>
      </svg>
    </div>
  </div>
  <div class="checkered-band"></div>
</section>

<div class="section-header">
  <h2 id="sectionTitle"></h2>
  <div class="section-divider"></div>
</div>

<main class="drivers-container" id="drivers"></main>

<footer>
  <p id="f1"></p>
  <p style="margin-top:0.5rem" id="f2"></p>
</footer>

<script>
const T = {
  en: {
    navTitle:  "Greatest Drivers",
    eyebrow:   "Formula 1",
    ht1:       "Top 10",
    ht2:       "Racers",
    subtitle:  "The Greatest Drivers in the History of the Sport",
    scroll:    "Scroll",
    section:   'The <em>All-Time</em> Greats',

    poles:     "Pole Positions",

    f2:        "Compiled from official <strong>Formula 1</strong> records &bull; Images via Wikimedia Commons",
    toggle:    "عربي"
  },
  ar: {
    navTitle:  "أعظم السائقين",
    eyebrow:   "الفورمولا 1",
    ht1:       "أفضل 10",
    ht2:       "سائقين",
    subtitle:  "أعظم السائقين في تاريخ الرياضة",
    scroll:    "مرر",
    section:   'عظماء <em>كل الأزمان</em>',
    rank:      "المرتبة",
    champ:     "بطل العالم",
    wins:      "انتصارات",
    poles:     "أعمدة الانطلاق",
    podiums:   "المنصات",
    fastest:   "أسرع أدوار",
    f1:        "تمثّل التصنيفات تقييماً متوازناً للبطولات والاتساق والإرث — عبر الحقب والفرق وتغييرات اللوائح.",
    f2:        "مُجمَّع من سجلات <strong>الفورمولا 1</strong> الرسمية &bull; الصور عبر ويكيميديا كومنز",
    toggle:    "English"
  }
};

const drivers = [
  {
    rank: 1,
    name: "Lewis Hamilton",       nameAr: "لويس هاميلتون",
    nat: "British",               natAr: "بريطاني",
    years: "2007 – Present",      yearsAr: "2007 – الحاضر",
    teams: "McLaren · Mercedes",
    champs: 7,

function buildCard(d, lang) {
  const t = T[lang];
  const ar = lang === 'ar';
  return `
  <article class="driver-card reveal">
    <div class="corner-deco"></div>
    <div class="card-rank">
      <div class="rank-number">${String(d.rank).padStart(2,'0')}</div>
      <div class="rank-label">${t.rank}</div>
    </div>
    <div class="card-photo">
      <img src="${d.img}" alt="${ar ? d.nameAr : d.name}" loading="lazy" onerror="this.style.background='#1a1a1a'">
    </div>
    <div class="card-info">
      <div class="driver-meta">
        <div class="driver-nationality">${ar ? d.natAr : d.nat}</div>
        <div class="driver-name">${ar ? d.nameAr : d.name}</div>
        <div class="driver-years">${ar ? d.yearsAr : d.years}</div>
        <div class="driver-teams">${d.teams}</div>
      </div>
      <div class="championships-badge">
        ${trophy}
        <span class="champ-count">${d.champs}x</span>
        <span class="champ-label">${t.champ}</span>
      </div>
    </div>
    <div class="card-stats">
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-value">${d.stats.wins}</div>
          <div class="stat-label">${t.wins}</div>
          <div class="stat-bar"><div class="stat-bar-fill" style="width:${(d.stats.wins/103*100).toFixed(1)}%"></div></div>
        </div>
        <div class="stat-item">
          <div class="stat-value">${d.stats.poles}</div>
          <div class="stat-label">${t.poles}</div>
          <div class="stat-bar"><div class="stat-bar-fill" style="width:${(d.stats.poles/102*100).toFixed(1)}%"></div></div>
        </div>
        <div class="stat-item">
          <div class="stat-value">${d.stats.podiums}</div>
          <div class="stat-label">${t.podiums}</div>
          <div class="stat-bar"><div class="stat-bar-fill" style="width:${(d.stats.podiums/191*100).toFixed(1)}%"></div></div>
        </div>
        <div class="stat-item">
          <div class="stat-value">${d.stats.fastest}</div>
          <div class="stat-label">${t.fastest}</div>
          <div class="stat-bar"><div class="stat-bar-fill" style="width:${(d.stats.fastest/54*100).toFixed(1)}%"></div></div>
        </div>
      </div>
      <p class="driver-bio">${ar ? d.bioAr : d.bio}</p>
    </div>
  </article>`;
}

let lang = 'en';

const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.style.transitionDelay = '0.05s';
      e.target.classList.add('visible');
      revealObserver.unobserve(e.target);
    }
  });
}, { threshold: 0.08 });

function render(l) {
  const t = T[l];
  const html = document.documentElement;
  html.lang = l;
  html.dir = l === 'ar' ? 'rtl' : 'ltr';

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (t[key] !== undefined) el.textContent = t[key];
  });

  document.getElementById('sectionTitle').innerHTML = t.section;
  document.getElementById('f1').innerHTML = t.f1;
  document.getElementById('f2').innerHTML = t.f2;
  document.getElementById('langBtn').textContent = t.toggle;

  document.getElementById('drivers').innerHTML = drivers.map(d => buildCard(d, l)).join('');
  document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

  document.title = l === 'ar'
    ? 'أفضل 10 سائقين فورمولا 1 على الإطلاق'
    : 'Top 10 Formula 1 Racers of All Time';
}

function toggleLang() {
  lang = lang === 'en' ? 'ar' : 'en';
  render(lang);
}

render('en');
